# Деплой сообщества из его собственного репозитория (см. SITES.md, «Деплой»).
#
# Pages у репозитория одна, и в moscowqa_site на ней moscowqa.ru. Поэтому у
# каждого другого сообщества свой репозиторий только под Pages, а этот файл
# лежит в нём как .github/workflows/deploy.yml. Контент и движок остаются в
# MoscowQA/moscowqa_site: репозиторий публичный, так что workflow просто
# забирает его без всяких ключей и собирает своё сообщество.
#
# Что поменять под сообщество: SITE ниже. Домен — Settings → Pages
# того репозитория (Source: GitHub Actions).

name: Build and Deploy

on:
  # Ночная пересборка: прошедшее/предстоящее считается на сборке.
  # 01:15 UTC — после moscowqa.ru (01:00), к утру по Москве.
  schedule:
    - cron: "15 1 * * *"
  # Ручной запуск: Actions → Build and Deploy → Run workflow.
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка moscowqa_site, из которой собирать"
        default: main

env:
  SITE: piterqa
  SOURCE_REPO: MoscowQA/moscowqa_site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ env.SOURCE_REPO }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: python build.py "$SITE"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/${{ env.SITE }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
