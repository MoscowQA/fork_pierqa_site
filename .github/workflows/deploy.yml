name: Build and Deploy

on:
  push:
    branches: [main]
  # Ночная пересборка. Прошло событие или ещё нет, теперь считается на сборке
  # (build.py, `split_events`), а не в браузере — без этого расписания разбивка
  # на главной застывала бы на дне последнего деплоя.
  #
  # 01:00 UTC — это 04:00 по Москве: к утру сайт уже знает, что вчерашний
  # митап прошёл. GitHub отключает расписание после 60 дней без коммитов в
  # репозиторий — тогда его надо включить обратно на вкладке Actions.
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Какой сайт выкладывать на Pages этого репозитория — переменная TARGET
# (Settings → Secrets and variables → Actions → Variables): домен из
# sites/*/site.yml. Файл один на все репозитории сообществ: у moscowqa_site
# TARGET=moscowqa.ru, у его форка под Piter QA — piterqa.ru. Форк
# синхронизируется с этим репозиторием, поэтому своего deploy.yml у него нет.
env:
  TARGET: ${{ vars.TARGET || 'moscowqa.ru' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find site for ${{ env.TARGET }}
        run: |
          SITE=$(python -c '
          import os, sys, sites
          target = os.environ["TARGET"]
          found = [s for s in sites.available_sites() if sites.load_site(s).domain == target]
          sys.exit(f"Нет сообщества с domain: {target} в sites/*/site.yml") if not found else print(found[0])
          ')
          echo "SITE=$SITE" >> "$GITHUB_ENV"
          echo "$TARGET → sites/$SITE"

      - name: Build site
        run: python build.py "$SITE"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/${{ env.SITE }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
